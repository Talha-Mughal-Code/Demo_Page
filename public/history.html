<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3ead49" />
  <title>Shelf Execution AI — History</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffffff'/%3E%3Ccircle cx='16' cy='9' r='5' fill='%23d3242c'/%3E%3Cpath d='M9 13a4 4 0 0 1 8 0v10H9z' fill='%233ead49'/%3E%3Cpath d='M15 13a4 4 0 0 1 8 0v10h-8z' fill='%233ead49'/%3E%3Crect x='4' y='23' width='24' height='3' rx='1.5' fill='%233ead49'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="appbar">
    <a class="appbar__brand" href="/index.html">
      <img class="appbar__logo" src="/logo-falcon.png" alt="Falcon Farms — flower growers and distributors" />
    </a>
    <span class="appbar__sub">Shelf Execution AI</span>
    <nav aria-label="Main">
      <a href="/index.html">Evaluate</a>
      <a href="/history.html" aria-current="page">History</a>
      <a href="/report.html">Report</a>
    </nav>
  </header>

  <main class="wrap">

    <!-- ------------------------------------------------------------------ -->
    <!-- List view                                                           -->
    <!-- ------------------------------------------------------------------ -->
    <section id="list-view">
      <div class="page-head">
        <div>
          <h1 class="page-title">History</h1>
          <p class="page-sub" id="history-count">Loading…</p>
        </div>
        <div class="actions" style="margin:0">
          <button type="button" class="btn" id="refresh-btn">Refresh</button>
          <a class="btn" href="/report.html">Open report →</a>
          <a class="btn btn--primary" href="/index.html">+ New evaluation</a>
        </div>
      </div>

      <div class="panel" style="margin-bottom:12px">
        <div class="panel__body" style="padding:12px">
          <div class="filter-row">
            <label class="field" style="flex:1 1 240px">
              <span>Search</span>
              <input type="text" id="f-search" placeholder="Store, section, photo name or verdict…" autocomplete="off" />
            </label>
            <label class="field" style="flex:0 1 180px">
              <span>Outcome</span>
              <select id="f-status">
                <option value="">All outcomes</option>
                <option value="fail">Fail</option>
                <option value="uncertain">Uncertain</option>
                <option value="pass">Pass</option>
              </select>
            </label>
            <label class="field" style="flex:0 1 180px">
              <span>Photo quality</span>
              <select id="f-quality">
                <option value="">All photos</option>
                <option value="good">Good</option>
                <option value="poor">Poor</option>
              </select>
            </label>
            <label class="field" style="flex:0 1 180px">
              <span>Sort</span>
              <select id="f-sort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="worst">Worst outcome first</option>
                <option value="matches">Most catalog matches</option>
              </select>
            </label>
            <div style="flex:0 0 auto; align-self:flex-end">
              <button type="button" class="btn btn--ghost" id="reset-btn">Reset</button>
            </div>
          </div>
        </div>
      </div>

      <div id="history-list" class="history-list"></div>
    </section>

    <!-- ------------------------------------------------------------------ -->
    <!-- Detail view                                                         -->
    <!-- ------------------------------------------------------------------ -->
    <section id="detail-view" hidden>
      <div class="page-head">
        <button type="button" class="btn" id="back-btn">← Back to history</button>
        <div class="actions" style="margin:0">
          <a class="btn" id="open-photo" target="_blank" rel="noopener">View full photo</a>
          <button type="button" class="btn btn--danger" id="delete-btn">Delete</button>
        </div>
      </div>
      <div id="detail-body"></div>
    </section>

    <div id="error-box" hidden style="margin-top:16px"></div>
  </main>

  <script type="module" src="/js/history.js"></script>
</body>
</html>
